{% extends "layout/base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Upload a memory</h4>
    <form method="POST" action="/photo/store" enctype="multipart/form-data" novalidate data-validate>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" required maxlength="200">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Image file</label>
        <input type="file" name="photo" class="form-control" required
               accept=".png,.jpg,.jpeg,.gif,.webp">
      </div>
      <button class="btn btn-dark w-100">Upload</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
